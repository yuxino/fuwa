name: Promote release draft

run-name: Promote ${{ inputs.tag }} draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.2
        required: true
        type: string
      macos_sha256:
        description: Accepted SHA-256 for the macOS zip
        required: true
        type: string
      windows_x64_sha256:
        description: Accepted SHA-256 for the Windows x64 installer
        required: true
        type: string
      windows_arm64_sha256:
        description: Accepted SHA-256 for the Windows ARM64 installer
        required: true
        type: string
      confirmation:
        description: Exact risk acknowledgement shown by the validation step
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-promotion-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify exact assets and publish draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-promotion

    steps:
      - name: Check out the exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify draft and accepted bytes
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTED_MACOS_SHA256: ${{ inputs.macos_sha256 }}
          ACCEPTED_WINDOWS_X64_SHA256: ${{ inputs.windows_x64_sha256 }}
          ACCEPTED_WINDOWS_ARM64_SHA256: ${{ inputs.windows_arm64_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v followed by three numeric components." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          expected_confirmation="publish Fuwa ${RELEASE_TAG} with unsigned Windows and unnotarized macOS assets"
          if [[ "$CONFIRMATION" != "$expected_confirmation" ]]; then
            echo "Confirmation must be exactly: $expected_confirmation" >&2
            exit 1
          fi
          for accepted_hash in \
            "$ACCEPTED_MACOS_SHA256" \
            "$ACCEPTED_WINDOWS_X64_SHA256" \
            "$ACCEPTED_WINDOWS_ARM64_SHA256"; do
            if [[ ! "$accepted_hash" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Every accepted SHA-256 must contain exactly 64 hexadecimal characters." >&2
              exit 1
            fi
          done

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "Checkout does not resolve to the requested tag commit." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag commit is not contained in origin/main." >&2
            exit 1
          fi

          read -r plist_version build_number < <(
            python3 - <<'PY'
          import plistlib
          with open("Resources/Info.plist", "rb") as stream:
              metadata = plistlib.load(stream)
          print(metadata["CFBundleShortVersionString"], metadata["CFBundleVersion"])
          PY
          )
          if [[ "$plist_version" != "$version" ]]; then
            echo "Tag version $version differs from Info.plist version $plist_version." >&2
            exit 1
          fi
          windows_version="${version}.${build_number}"

          successful_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f event=push \
              -f status=success \
              -f per_page=100
          )"
          tag_run_id="$(
            jq -er --arg commit "$tag_commit" --arg tag "$RELEASE_TAG" \
              '[.workflow_runs[] |
                select(
                  .head_sha == $commit and
                  .head_branch == $tag and
                  .conclusion == "success"
                )] |
               sort_by(.run_attempt, .id) |
               last.id' \
              <<<"$successful_runs"
          )" || {
            echo "No successful tag CI run was found for the release commit." >&2
            exit 1
          }
          tag_run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${tag_run_id}"

          release_json="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
            echo "The target Release does not exist as a draft." >&2
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' <<<"$release_json")" != "false" ]]; then
            echo "Stable promotion refuses a prerelease draft." >&2
            exit 1
          fi
          release_id="$(jq -r '.id' <<<"$release_json")"

          macos_zip="Fuwa-${version}.zip"
          windows_x64="Fuwa-${version}-windows-x64-setup.exe"
          windows_arm64="Fuwa-${version}-windows-arm64-setup.exe"
          expected_assets=(
            "$macos_zip"
            "${macos_zip}.sha256"
            "$windows_x64"
            "${windows_x64}.sha256"
            "Fuwa-${version}-windows-x64-evidence.json"
            "$windows_arm64"
            "${windows_arm64}.sha256"
            "Fuwa-${version}-windows-arm64-evidence.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_assets[@]}" | sort)
          mapfile -t actual_sorted < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          if ! diff -u \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${actual_sorted[@]}"); then
            echo "Draft assets do not match the exact eight-file release contract." >&2
            exit 1
          fi
          asset_snapshot="$(
            jq -c '[.assets[] | {id, name, size, updated_at, digest}] | sort_by(.name)' \
              <<<"$release_json"
          )"

          asset_dir="$RUNNER_TEMP/fuwa-release-assets"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" --dir "$asset_dir"
          cd "$asset_dir"

          verify_package() {
            local package_name="$1"
            local accepted_hash="${2,,}"
            local checksum_name="${package_name}.sha256"
            local line_count
            local recorded_hash
            local recorded_name
            local actual_hash

            line_count="$(awk 'NF { count += 1 } END { print count + 0 }' "$checksum_name")"
            if [[ "$line_count" != "1" ]]; then
              echo "$checksum_name must contain exactly one non-empty checksum record." >&2
              exit 1
            fi
            read -r recorded_hash recorded_name < "$checksum_name"
            recorded_hash="${recorded_hash,,}"
            recorded_name="${recorded_name#\*}"
            if [[ "$recorded_hash" != "$accepted_hash" || "$recorded_name" != "$package_name" ]]; then
              echo "$checksum_name does not record the accepted package bytes." >&2
              exit 1
            fi
            actual_hash="$(sha256sum "$package_name" | awk '{ print tolower($1) }')"
            if [[ "$actual_hash" != "$accepted_hash" ]]; then
              echo "$package_name does not match its independently accepted SHA-256." >&2
              exit 1
            fi
          }

          verify_package "$macos_zip" "$ACCEPTED_MACOS_SHA256"
          verify_package "$windows_x64" "$ACCEPTED_WINDOWS_X64_SHA256"
          verify_package "$windows_arm64" "$ACCEPTED_WINDOWS_ARM64_SHA256"

          verify_windows_evidence() {
            local architecture="$1"
            local installer_name="$2"
            local accepted_hash="${3,,}"
            local evidence_name="Fuwa-${version}-windows-${architecture}-evidence.json"

            jq -e \
              --arg architecture "$architecture" \
              --arg package_version "$version" \
              --arg windows_version "$windows_version" \
              --arg commit "${tag_commit,,}" \
              --arg workflow_url "$tag_run_url" \
              --arg installer_name "$installer_name" \
              --arg installer_hash "$accepted_hash" \
              '.schemaVersion == 1 and
               .success == true and
               .expected.architecture == $architecture and
               .expected.packageVersion == $package_version and
               .expected.version == $windows_version and
               (.provenance.sourceCommit | ascii_downcase) == $commit and
               .provenance.workflowRunUrl == $workflow_url and
               .artifacts.installer.name == $installer_name and
               (.artifacts.installer.sha256 | ascii_downcase) == $installer_hash' \
              "$evidence_name" >/dev/null
          }

          verify_windows_evidence x64 "$windows_x64" "$ACCEPTED_WINDOWS_X64_SHA256"
          verify_windows_evidence arm64 "$windows_arm64" "$ACCEPTED_WINDOWS_ARM64_SHA256"

          fresh_release_json="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          )"
          fresh_snapshot="$(
            jq -c '[.assets[] | {id, name, size, updated_at, digest}] | sort_by(.name)' \
              <<<"$fresh_release_json"
          )"
          if [[ "$(jq -r '.draft' <<<"$fresh_release_json")" != "true" ]]; then
            echo "Draft state changed during verification." >&2
            exit 1
          fi
          if [[ "$fresh_snapshot" != "$asset_snapshot" ]]; then
            echo "Draft assets changed during verification." >&2
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.verify.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=true >/dev/null
