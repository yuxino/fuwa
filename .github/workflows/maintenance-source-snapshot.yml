name: Maintenance source snapshot
on:
  push:
    branches: [chore/macos-only]
    paths: ['.github/workflows/maintenance-source-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 5a989244e1cba3cf4f03135a94b85f8d5b023f8c
      - name: Export tracked source for maintenance
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/fuwa-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: fuwa-maintenance-source
          path: ${{ runner.temp }}/fuwa-source.tar.gz
          retention-days: 1
          if-no-files-found: error
