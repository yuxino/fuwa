name: Apply reviewed macOS-only maintenance
on:
  push:
    branches: [chore/macos-only]
    paths: ['.github/workflows/maintenance-apply-macos-only.yml']
permissions:
  contents: read
concurrency:
  group: apply-macos-only
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'yuxino/fuwa' && github.ref == 'refs/heads/chore/macos-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify and apply the locally tested source changes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          baseline = '5a989244e1cba3cf4f03135a94b85f8d5b023f8c'
          staging = {
              '.github/workflows/maintenance-source-snapshot.yml',
              '.github/workflows/maintenance-apply-macos-only.yml',
              '.github/maintenance/macos-only.b64',
              '.github/maintenance/apply-01.txt',
              '.github/maintenance/apply-02.txt',
              '.github/maintenance/apply-03.txt',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines())
          if actual != staging:
              raise SystemExit('Unexpected branch changes; refusing to overwrite other work.')
          data = b''.join(Path(f'.github/maintenance/apply-{i:02d}.txt').read_bytes()
                          for i in (1, 2, 3))
          if hashlib.sha256(data).hexdigest() != '2185de9cf831f103268711d79ef8c6794c716cb8b9583fa93184da0af0d8d588':
              raise SystemExit('Maintenance script checksum mismatch.')
          script = Path(os.environ['RUNNER_TEMP']) / 'apply-macos-only.py'
          script.write_bytes(data)
          subprocess.run(['python3', '-B', str(script)], check=True)
          subprocess.run(['git', 'rm', '--', *sorted(staging)], check=True)
          PY
          git add -A
          test "$(git write-tree)" = b26153af884dc50690db30323fa60aff1d78010e
          git diff --cached --check
          python3 -B scripts/test-macos-only.py
          python3 -B scripts/test-update-metadata.py
          bash -n scripts/verify-release-checksum.sh
          bash -n scripts/test-verify-release-checksum.sh
          bash scripts/test-verify-release-checksum.sh
          git diff --exit-code
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: maintain Fuwa for macOS only'
          git push origin HEAD:refs/heads/chore/macos-only
          git rev-parse HEAD
