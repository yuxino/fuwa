name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checksum:
    name: Release checksum parser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse and test release checksum verifier
        shell: bash
        run: |
          bash -n scripts/verify-release-checksum.sh
          bash -n scripts/test-verify-release-checksum.sh
          bash scripts/test-verify-release-checksum.sh
          python3 -m py_compile \
            scripts/update-metadata.py \
            scripts/test-update-metadata.py
          python3 scripts/test-update-metadata.py

  swift:
    name: Strict build and logic tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        run: swift --version

      - name: Build Fuwa in Release mode
        run: >-
          swift build --configuration release --product Fuwa
          -Xswiftc -Osize
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Run logic tests in Release mode
        run: >-
          swift run --configuration release
          -Xswiftc -Osize
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          FuwaLogicTests

      - name: Verify app icon assets
        run: ./scripts/generate-app-icon.sh --check

      - name: Check macOS scripts and signing guard
        run: |
          for script in scripts/*.sh; do
            case "$(head -n 1 "$script")" in
              '#!/bin/zsh') zsh -n "$script" ;;
              '#!/usr/bin/env bash') bash -n "$script" ;;
              *)
                echo "Unknown shell for $script" >&2
                exit 1
                ;;
            esac
          done
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          ast.parse(
              Path("scripts/verify-macos-signature-pin.py").read_text(encoding="utf-8")
          )
          pins = json.loads(
              Path("scripts/release-signing-pins.json").read_text(encoding="utf-8")
          )
          if pins.get("schemaVersion") != 1:
              raise SystemExit("unsupported release signing pin schema")
          PY
          if FUWA_CODESIGN_IDENTITY=- scripts/codesign-identity.sh; then
            echo "ad-hoc signing was accepted" >&2
            exit 1
          fi
          if FUWA_BUILD_UNIVERSAL=unexpected scripts/package-app.sh; then
            echo "an invalid universal-build mode was accepted" >&2
            exit 1
          fi
          if grep -R 'FUWA_ALLOW_AD_HOC_SIGNING' scripts README.md README_EN.md; then
            echo "an ad-hoc signing escape hatch was reintroduced" >&2
            exit 1
          fi

  windows:
    name: Windows ${{ matrix.arch }} build and installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake-arch: x64
            runner: windows-2025
          - arch: arm64
            cmake-arch: ARM64
            runner: windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show native toolchain
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -property installationVersion

      - name: Parse PowerShell delivery scripts
        shell: powershell
        run: |
          $scripts = @(
            'windows/scripts/manifest-policy.ps1',
            'windows/scripts/verify-artifact.ps1',
            'windows/lab/acceptance.ps1',
            'windows/tests/ManifestPolicyTests.ps1',
            'windows/tests/ReleaseMetadataTests.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parser rejected $script."
            }
          }

      - name: Test manifest policy verifier
        shell: powershell
        run: ./windows/tests/ManifestPolicyTests.ps1

      - name: Test release metadata consistency
        shell: powershell
        run: ./windows/tests/ReleaseMetadataTests.ps1

      - name: Configure native Windows target
        shell: pwsh
        run: >-
          cmake -S windows -B build/windows
          -A ${{ matrix.cmake-arch }}

      - name: Build with warnings as errors
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Run Windows core tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Create per-user installer
        shell: pwsh
        run: >-
          cpack --config build/windows/CPackConfig.cmake
          -C Release -G INNOSETUP -B dist/windows

      - name: Verify desktop shortcut packaging
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath build/windows/CPackConfig.cmake -Raw
          if ($config -cnotmatch 'CPACK_INNOSETUP_EXTRA_SCRIPTS.+FuwaDesktopShortcut\.iss') {
            throw "CPack is not configured to include the Fuwa desktop shortcut script."
          }
          $shortcut = Get-Content -LiteralPath windows/installer/FuwaDesktopShortcut.iss -Raw
          if ($shortcut -cnotmatch 'Name: "\{autodesktop\}\\Fuwa"; Filename: "\{app\}\\Fuwa\.exe"') {
            throw "The included installer script does not create the exact Fuwa desktop shortcut."
          }

      - name: Verify executable and installer
        shell: powershell
        run: |
          $installer = Get-ChildItem -LiteralPath dist/windows -Filter '*-setup.exe'
          if ($installer.Count -ne 1) {
            throw "Expected exactly one installer, found $($installer.Count)."
          }
          ./windows/scripts/verify-artifact.ps1 `
            -ExecutablePath build/windows/Release/Fuwa.exe `
            -InstallerPath $installer.FullName `
            -ExpectedArchitecture '${{ matrix.arch }}' `
            -ExpectedVersion '0.1.5.6' `
            -ExpectedPackageVersion '0.1.5' `
            -SourceCommit '${{ github.sha }}' `
            -WorkflowRunUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' `
            -ManifestPath windows/resources/app.manifest `
            -OutputPath "dist/windows/Fuwa-0.1.5-windows-${{ matrix.arch }}-evidence.json"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Fuwa-windows-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/windows/Fuwa-0.1.5-windows-${{ matrix.arch }}-setup.exe
            dist/windows/Fuwa-0.1.5-windows-${{ matrix.arch }}-setup.exe.sha256
            dist/windows/Fuwa-0.1.5-windows-${{ matrix.arch }}-evidence.json
