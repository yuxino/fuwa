name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Strict build and logic tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        run: swift --version

      - name: Build Fuwa in Release mode
        run: >-
          swift build --configuration release --product Fuwa
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Run logic tests in Release mode
        run: >-
          swift run --configuration release
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          FuwaLogicTests

      - name: Verify app icon assets
        run: ./scripts/generate-app-icon.sh --check

      - name: Check macOS scripts and signing guard
        run: |
          zsh -n scripts/*.sh
          if FUWA_CODESIGN_IDENTITY=- scripts/codesign-identity.sh; then
            echo "ad-hoc signing was accepted" >&2
            exit 1
          fi
          if FUWA_BUILD_UNIVERSAL=unexpected scripts/package-app.sh; then
            echo "an invalid universal-build mode was accepted" >&2
            exit 1
          fi
          if grep -R 'FUWA_ALLOW_AD_HOC_SIGNING' scripts README.md README_EN.md; then
            echo "an ad-hoc signing escape hatch was reintroduced" >&2
            exit 1
          fi

  windows:
    name: Windows ${{ matrix.arch }} build and installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake-arch: x64
            runner: windows-2025
          - arch: arm64
            cmake-arch: ARM64
            runner: windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show native toolchain
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -property installationVersion

      - name: Parse PowerShell delivery scripts
        shell: powershell
        run: |
          $scripts = @(
            'windows/scripts/verify-artifact.ps1',
            'windows/lab/acceptance.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parser rejected $script."
            }
          }

      - name: Configure native Windows target
        shell: pwsh
        run: >-
          cmake -S windows -B build/windows
          -A ${{ matrix.cmake-arch }}

      - name: Build with warnings as errors
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Run Windows core tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Create per-user installer
        shell: pwsh
        run: >-
          cpack --config build/windows/CPackConfig.cmake
          -C Release -G INNOSETUP -B dist/windows

      - name: Verify executable and installer
        shell: powershell
        run: |
          $installer = Get-ChildItem -LiteralPath dist/windows -Filter '*-setup.exe'
          if ($installer.Count -ne 1) {
            throw "Expected exactly one installer, found $($installer.Count)."
          }
          ./windows/scripts/verify-artifact.ps1 `
            -ExecutablePath build/windows/Release/Fuwa.exe `
            -InstallerPath $installer.FullName `
            -ExpectedArchitecture '${{ matrix.arch }}' `
            -ExpectedVersion '0.1.1.2' `
            -ManifestPath windows/resources/app.manifest `
            -OutputPath "dist/windows/Fuwa-0.1.1.2-windows-${{ matrix.arch }}-evidence.json"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Fuwa-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/windows/Fuwa-0.1.1.2-windows-${{ matrix.arch }}-setup.exe
            dist/windows/Fuwa-0.1.1.2-windows-${{ matrix.arch }}-setup.exe.sha256
            dist/windows/Fuwa-0.1.1.2-windows-${{ matrix.arch }}-evidence.json
